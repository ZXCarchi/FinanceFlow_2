{% load i18n %}<div class="modal hidden" id="transactionModal" data-modal><div class="modal-card"><div class="modal-head"><div><span class="modal-kicker">{% trans 'Quick entry' %}</span><h3>{% trans 'Add transaction' %}</h3></div><button class="icon-button" type="button" data-close-modal>×</button></div><form method="post" action="{% url 'transaction_add' %}" class="form-stack">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><div class="form-grid two">{% for field in tx_form %}<div class="field {% if field.name == 'title' or field.name == 'note' %}wide{% endif %}"><label>{{ field.label }}</label>{{ field }}{% for error in field.errors %}<em>{{ error }}</em>{% endfor %}</div>{% endfor %}</div><button class="btn btn-primary full" type="submit">{% trans 'Save transaction' %}</button></form></div></div>
