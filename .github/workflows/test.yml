name: FinanceFlow checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: financeflow
          POSTGRES_USER: financeflow
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U financeflow -d financeflow"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_DEBUG: '1'
      DATABASE_URL: postgresql://financeflow:local-ci-only@localhost:5432/financeflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test
      - run: python manage.py collectstatic --noinput
      - run: find static/app -name '*.js' -exec node --check {} \;
      - name: Production configuration checks
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: ci-check-only-key-not-for-real-deployments-7c483299207b84952bc15206
          DJANGO_ALLOWED_HOSTS: financeflow.example
        run: python manage.py check --deploy --fail-level WARNING
